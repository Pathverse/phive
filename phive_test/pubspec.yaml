name: phive_test
description: "Integration test package for validating PHive generator and runtime behavior."
version: 0.8.0
homepage: https://github.com/Pathverse/phive
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.24.0
  hive_ce_flutter: ^2.6.0
  phive: ^0.8.0
  phive_barrel: ^0.8.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_secure_storage: '>=10.0.0 <12.0.0'
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  phive_generator: ^0.8.0

dependency_overrides:
  phive:
    path: ../phive
  phive_barrel:
    path: ../phive_barrel
  phive_generator:
    path: ../phive_generator
