name: phive_example
description: A standalone PHive storage round-trip example.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  phive:
    path: ../
  hive_ce: ^2.24.0

dev_dependencies:
  build_runner: ^2.12.1
  phive_generator: ^0.9.0
  flutter_lints: ^6.0.0

# Resolve the coordinated release locally until 0.9.0 is published.
dependency_overrides:
  phive:
    path: ../
  phive_generator:
    path: ../../phive_generator
