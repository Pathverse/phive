name: phive_barrel_example
description: Demonstrate TTL expiry and deletion through a PHive router.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  phive_barrel:
    path: ../
  phive: ^0.9.0
  hive_ce: ^2.24.0

dev_dependencies:
  phive_generator:
    path: ../../phive_generator
  build_runner: ^2.12.1
  flutter_lints: ^6.0.0

# Resolve the in-repo runtime until phive 0.9.0 is published.
dependency_overrides:
  phive:
    path: ../../phive
